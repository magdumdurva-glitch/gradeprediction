name: CI/CD Pipeline - Student Grade Prediction

# Trigger pipeline on push or pull request to main/master branches
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  # ==========================================================
  # STAGE 1: BUILD STAGE
  # ==========================================================
  build:
    name: Build & Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip and Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python Files (Syntax Verification)
        run: |
          python -m compileall .

      - name: Train / Verify Model Artifact Generation
        run: |
          python model.py

  # ==========================================================
  # STAGE 2: TEST STAGE
  # ==========================================================
  test:
    name: Run Unit Tests (Pytest)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v --junitxml=pytest-report.xml

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-report.xml

  # ==========================================================
  # STAGE 3: DEPLOY STAGE
  # ==========================================================
  deploy:
    name: Docker Build & Container Deployment
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          echo "Building Docker Image for Student Grade Prediction App..."
          docker build -t student-grade-prediction:latest .

      - name: Run Container & Test Health Endpoint
        run: |
          echo "Starting Docker Container in detached mode..."
          docker run -d -p 5000:5000 --name grade-app student-grade-prediction:latest
          
          echo "Waiting 6 seconds for container service startup..."
          sleep 6

          echo "Inspecting running containers..."
          docker ps -a

          echo "Testing Application Health Endpoint..."
          curl --fail http://localhost:5000/api/health || (docker logs grade-app && exit 1)

          echo "Testing Prediction API via Container..."
          curl -X POST http://localhost:5000/api/predict \
            -H "Content-Type: application/json" \
            -d '{"hours": 20, "attendance": 85}'

          echo "Container verified successfully! Stopping test container..."
          docker stop grade-app

      - name: Deployment Success Notification
        run: |
          echo "=========================================================="
          echo "CI/CD Pipeline Completed Successfully!"
          echo "Stages Executed: Build -> Test -> Deploy"
          echo "Application Docker image successfully built & verified."
          echo "=========================================================="
